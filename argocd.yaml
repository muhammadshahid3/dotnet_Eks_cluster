apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/muhammadshahid3/dotnet_Eks_cluster.git
    targetRevision: main
    path: helm/product-api
    helm:
      releaseName: product-api
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: product

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
